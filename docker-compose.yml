# MIT 8103 – Advanced Database Systems Portfolio
# Local database environment for Portfolios 1–3 (PostgreSQL + pgAdmin)
#
# Start:  docker compose up -d
# Stop:   docker compose down
#
# NOTE: These passwords are for a LOCAL practice database only.
#       No real NRS data is ever stored here.

services:
  postgres:
    image: postgres:16
    container_name: nrs_postgres
    shm_size: 256mb          # shared memory for parallel queries (Docker default 64mb is too small)
    environment:
      POSTGRES_USER: nrs_admin
      POSTGRES_PASSWORD: nrs_password
      POSTGRES_DB: nrs_tax_db
    ports:
      - "5432:5432"
    volumes:
      - nrs_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: nrs_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  nrs_pgdata:
