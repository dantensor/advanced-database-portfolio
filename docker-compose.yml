# MIT 8103 – Advanced Database Systems Portfolio
# Local database environment: PostgreSQL + pgAdmin (Portfolios 1–3),
#                             MongoDB + mongo-express (Portfolio 4)
#
# Start:  docker compose up -d
# Stop:   docker compose down
#
# NOTE: These passwords are for a LOCAL practice database only.
#       No real NRS data is ever stored here.

services:
  postgres:
    image: postgres:16
    container_name: nrs_postgres
    shm_size: 256mb          # shared memory for parallel queries (Docker default 64mb is too small)
    environment:
      POSTGRES_USER: nrs_admin
      POSTGRES_PASSWORD: nrs_password
      POSTGRES_DB: nrs_tax_db
    ports:
      - "5432:5432"
    volumes:
      - nrs_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: nrs_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # ---- Portfolio 4: MongoDB (document database) ----
  mongo:
    image: mongo:7.0
    container_name: nrs_mongo
    ports:
      - "127.0.0.1:27017:27017"   # local machine only (no password on this practice DB)
    volumes:
      - nrs_mongodata:/data/db

  # Web viewer for MongoDB (like pgAdmin): http://localhost:8081  (login admin / admin)
  mongo-express:
    image: mongo-express:1.0.2
    container_name: nrs_mongo_express
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - mongo

volumes:
  nrs_pgdata:
  nrs_mongodata:
